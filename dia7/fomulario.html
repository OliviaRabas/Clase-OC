<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="../dia8/formulario.css">
</head>
<body>
    <header>Formulario</header>
    <main>

        <label>Nombre:</label>
        <input type="text" placeholder="Escribe tu nombre" required>
        <br>

        <!-- Campo de contraseña (los caracteres se ocultan) -->
        <label>Contraseña:</label>
        <input type="password" placeholder="Tu clave secreta">
        <br>

        <!-- Campo numérico -->
        <label>Edad:</label>
        <input type="number" min="18" max="99">
        <br>

        <!-- Casilla de verificación -->
        <label>Acepto términos:</label>
        <input type="checkbox" name="terms">
        <br>

        <!-- Selector de fecha -->
        <label>Fecha de Nacimiento:</label>
        <input type="date">
        <br>

        <!-- Botón de envío -->
        <button type="submit">Enviar Datos</button>
        <br>
        <a href="index.html">
            <button type="button">Volver al Index</button>
        </a>
    </main>
    <footer>
        <h6>"Pili y Oli: entre trenzas, rulos y líneas de código, crean sueños que cobran vida."</h6>
    </footer>
    
</body>
</html>
